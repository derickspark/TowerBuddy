<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NS-TOWER</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: rgba(16, 20, 34, 0.92);
    --accent: #ffd35d;
    --accent2: #ff8f5d;
    --text: #e8f0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage { position: relative; }
  canvas {
    display: block;
    background: #05070f;
    box-shadow: 0 0 60px rgba(255, 211, 93, 0.10), 0 0 0 1px rgba(255,255,255,0.05);
    border-radius: 10px;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    background: rgba(5, 7, 15, 0.82);
    backdrop-filter: blur(3px);
    border-radius: 10px;
    overflow-y: auto;
  }
  .overlay.hidden { display: none; }
  h1 {
    font-size: clamp(26px, 7vw, 40px);
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 2px;
  }
  .sub { color: #9fb3d0; font-size: 12px; margin-bottom: 12px; letter-spacing: 1px; }
  .card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 16px;
    width: min(330px, 92%);
    line-height: 1.6;
    font-size: 13px;
    color: #cfe0f5;
    margin-bottom: 10px;
    text-align: left;
  }
  .card h3 {
    font-size: 12px; color: #8fa3c0; letter-spacing: 1px;
    margin-bottom: 6px; text-transform: uppercase;
  }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt {
    flex: 1 1 auto;
    text-align: center;
    padding: 7px 10px;
    border-radius: 8px;
    background: #1b2440;
    border: 1px solid rgba(255,255,255,0.12);
    cursor: pointer;
    font-size: 13px;
    color: #aebfd8;
    white-space: nowrap;
  }
  .opt.on {
    background: linear-gradient(180deg, #4a5a8a, #37456e);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(255,211,93,0.25);
  }
  button.primary {
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #241a05;
    background: linear-gradient(180deg, #ffe28a, var(--accent));
    border: none;
    border-radius: 40px;
    padding: 12px 36px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,211,93,0.3);
    margin: 4px;
  }
  button.secondary {
    font-family: inherit;
    font-size: 14px;
    color: #cfe0f5;
    background: #1b2440;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 40px;
    padding: 10px 26px;
    cursor: pointer;
    margin: 4px;
  }
  button.mini {
    font-family: inherit;
    font-size: 11px;
    color: #8fa3c0;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 4px 12px;
    cursor: pointer;
    margin-top: 6px;
  }
  .big-score { font-size: 46px; font-weight: bold; color: var(--accent); }
  .sub2 { color: #9fb3d0; font-size: 13px; margin: 4px 0 10px; }
  .scores { list-style: none; font-size: 13px; color: #a9bcd8; width: min(280px, 90%); margin-bottom: 8px; }
  .scores li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.08); }
  .scores li .rk { color: #6f83a3; width: 30px; }
  .scores li .nm { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scores li.me { color: var(--accent); }
  #nameRow { display: flex; gap: 8px; margin-bottom: 12px; }
  #nameInput {
    font-family: inherit;
    font-size: 15px;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: #101828;
    color: #fff;
    width: 160px;
    text-align: center;
  }
  #pauseBtn {
    position: absolute;
    top: 46px; right: 8px;
    z-index: 5;
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(10,14,26,0.6);
    color: #cfe0f5;
    font-size: 15px;
    cursor: pointer;
    display: none;
  }
  .legend { font-size: 12px; color: #a9bcd8; line-height: 1.9; }
  .chip {
    display: inline-block; width: 30px; height: 9px; border-radius: 3px;
    vertical-align: middle; margin-right: 6px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="pauseBtn" title="일시정지 (ESC)">⏸</button>

    <!-- 시작 화면 -->
    <div id="startScreen" class="overlay">
      <h1>NS-TOWER</h1>
      <div class="sub">NAGI-P SOFT 원작 (1997) · 웹 리메이크</div>

      <div class="card">
        <h3>난이도</h3>
        <div class="row" id="diffRow">
          <div class="opt" data-diff="easy">쉬움</div>
          <div class="opt on" data-diff="normal">보통</div>
          <div class="opt" data-diff="hard">어려움</div>
        </div>
      </div>

      <div class="card">
        <h3>특수 발판</h3>
        <div class="row" id="floorRow">
          <div class="opt on" data-floor="conveyor">컨베이어</div>
          <div class="opt on" data-floor="hmove">좌우 이동</div>
          <div class="opt on" data-floor="vmove">상하 이동</div>
          <div class="opt on" data-floor="spring">점프대</div>
        </div>
      </div>

      <div class="card">
        <h3>옵션</h3>
        <div class="row" id="optRow">
          <div class="opt on" data-opt="music">음악</div>
          <div class="opt on" data-opt="sfx">효과음</div>
          <div class="opt" data-opt="jumps">점프 수 표시</div>
        </div>
      </div>

      <div>
        <button class="primary" id="startBtn">게임 시작</button>
        <button class="secondary" id="practiceBtn">연습</button>
      </div>
      <div class="sub" style="margin-top:8px">누르고 있으면 파워 충전 · 떼면 점프<br>SPACE / 마우스 / 터치</div>
      <button class="mini" id="clearBtn">베스트 5 기록 초기화</button>
    </div>

    <!-- 일시정지 -->
    <div id="pauseScreen" class="overlay hidden">
      <h1 style="font-size:28px">일시정지</h1>
      <div class="sub2">ESC 또는 버튼으로 계속</div>
      <button class="primary" id="resumeBtn">계속하기</button>
      <button class="secondary" id="quitBtn">그만하기</button>
    </div>

    <!-- 게임 오버 -->
    <div id="overScreen" class="overlay hidden">
      <h1 style="font-size:30px">GAME OVER</h1>
      <div class="big-score"><span id="finalScore">0</span>층</div>
      <div class="sub2" id="overInfo"></div>
      <div id="nameRow" class="hidden" style="display:none">
        <input id="nameInput" maxlength="10" placeholder="이름 입력" />
        <button class="primary" id="regBtn" style="padding:9px 20px;font-size:14px">등록</button>
      </div>
      <ul class="scores" id="scoreList"></ul>
      <div>
        <button class="primary" id="retryBtn">다시 도전</button>
        <button class="secondary" id="menuBtn">메뉴로</button>
      </div>
    </div>
  </div>
</div>

    } catch (e) {}
    return [];
  }
  function sortRecords(a) {
    a.sort((x, y) => y.floor - x.floor || x.jumps - y.jumps);
    return a.slice(0, 5);
  }

  // ================= Difficulty presets =================
  // width range + per-type appearance rate (only if the type is enabled)
  const DIFFS = {
    easy:   { w: [92, 150], rates: { conveyor: 0.08, hmove: 0.06, vmove: 0.05, spring: 0.05 } },
    normal: { w: [64, 120], rates: { conveyor: 0.12, hmove: 0.10, vmove: 0.08, spring: 0.06 } },
    hard:   { w: [46, 88],  rates: { conveyor: 0.16, hmove: 0.14, vmove: 0.12, spring: 0.07 } },
  };

  // ================= Game state =================
  const T_NORMAL = 0, T_CONVEYOR = 1, T_HMOVE = 2, T_VMOVE = 3, T_SPRING = 4;
  let platforms = [], player, camTop, camTarget;
  let score = 0, jumps = 0, charging = false, power = POWER_MIN, powerDir = 1;
  let state = "menu"; // menu | play | pause | over
  let practice = false;
  let time = 0;
  let particles = [];
  let topFloorMade = 0;
  const START_Y = H - 110;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function activeRates() {
    if (practice) return {};
    const base = DIFFS[settings.diff].rates;
    const r = {};
    for (const k in base) if (settings.floors[k]) r[k] = base[k];
    return r;
  }

  function makePlatform(floor) {
    const wr = practice ? DIFFS.normal.w : DIFFS[settings.diff].w;
    const w = rand(wr[0], wr[1]);
    const x = rand(INNER_L + 4, INNER_R - w - 4);
    let type = T_NORMAL;
    const rates = activeRates();
    let r = Math.random(), acc = 0;
    for (const k in rates) {
      acc += rates[k];
      if (r < acc) {
        type = { conveyor: T_CONVEYOR, hmove: T_HMOVE, vmove: T_VMOVE, spring: T_SPRING }[k];
        break;
      }
    }
    const y = START_Y - floor * FLOOR_GAP;
    return {
      floor, x, y, w, h: 12, type,
      baseY: y,
      dir: Math.random() < 0.5 ? -1 : 1,
      spd: rand(0.6, 1.2),
      range: [INNER_L + 4, INNER_R - w - 4],
      phase: rand(0, Math.PI * 2),
    };
  }

  function seedTower() {
    platforms = [{
      floor: 0, x: INNER_L + 4, y: START_Y, w: INNER_W - 8, h: 12,
      type: T_NORMAL, baseY: START_Y, dir: 1, spd: 0, range: [0, 0], phase: 0,
    }];
    topFloorMade = 0;
    for (let f = 1; f <= 24; f++) { platforms.push(makePlatform(f)); topFloorMade = f; }
  }

  function ensurePlatforms() {
    while (START_Y - topFloorMade * FLOOR_GAP > camTop - H) {
      topFloorMade++;
      platforms.push(makePlatform(topFloorMade));
    }
    const cullBelow = camTop + H + 200;
    platforms = platforms.filter(p => p.baseY < cullBelow);
  }

  function reset() {
    seedTower();
    player = {
      x: (INNER_L + INNER_R) / 2 - CHAR_W / 2,
      y: START_Y - CHAR_H,
      vx: MOVE_SPEED * (Math.random() < 0.5 ? -1 : 1),
      vy: 0, onGround: true, standing: platforms[0],
      squash: 0, face: 1,
    };
    camTop = player.y - H * 0.42;
    camTarget = camTop;
    score = 0; jumps = 0;
    charging = false; inputHeld = false; power = POWER_MIN; powerDir = 1;
    particles = [];
  }

  // ================= Audio =================
  let AC = null, bgmGain = null, sfxGain = null;
  let bgmOn = false, bgmIdx = 0, bgmStart = 0, bgmTimer = null;

  function ensureAudio() {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      bgmGain = AC.createGain(); bgmGain.gain.value = 0.5; bgmGain.connect(AC.destination);
      sfxGain = AC.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(AC.destination);
    }
    if (AC.state === "suspended") AC.resume();
  }

  // --- BGM: schedule original MIDI notes with simple synth voices ---
  const CH_VOICE = {
    0: { type: "triangle", gain: 0.16, oct: 0 },   // slap bass
    1: { type: "square",   gain: 0.065, oct: 0 },  // clavinet (melody)
    2: { type: "sawtooth", gain: 0.05, oct: 0 },   // organ pad
    3: { type: "sawtooth", gain: 0.11, oct: 0 },   // synth bass
  };
  function midiFreq(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  function scheduleNote(nt, when) {
    const [s, d, ch, note, vel] = nt;
    if (ch === 9) { scheduleDrum(note, when, vel); return; }
    const v = CH_VOICE[ch]; if (!v) return;
    const o = AC.createOscillator();
    o.type = v.type;
    o.frequency.value = midiFreq(note);
    const g = AC.createGain();
    const amp = v.gain * (vel / 127);
    const dur = Math.max(0.05, d);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(amp, when + 0.008);
    g.gain.setValueAtTime(amp, when + Math.max(0.008, dur - 0.04));
    g.gain.linearRampToValueAtTime(0, when + dur);
    o.connect(g); g.connect(bgmGain);
    o.start(when); o.stop(when + dur + 0.05);
  }
  let noiseBuf = null;
  function getNoise() {
    if (!noiseBuf) {
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.3, AC.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }
  function scheduleDrum(note, when, vel) {
    const v = vel / 127;
    if (note === 35 || note === 36) { // kick
      const o = AC.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(110, when);
      o.frequency.exponentialRampToValueAtTime(40, when + 0.09);
      const g = AC.createGain();
      g.gain.setValueAtTime(0.5 * v, when);
      g.gain.exponentialRampToValueAtTime(0.001, when + 0.12);
      o.connect(g); g.connect(bgmGain); o.start(when); o.stop(when + 0.14);
    } else {
      const src = AC.createBufferSource(); src.buffer = getNoise();
      const f = AC.createBiquadFilter();
      let dur = 0.05, gain = 0.10 * v;
      if (note === 38 || note === 40) { f.type = "bandpass"; f.frequency.value = 1800; dur = 0.11; gain = 0.22 * v; }
      else if (note === 46) { f.type = "highpass"; f.frequency.value = 6000; dur = 0.12; gain = 0.12 * v; }
      else { f.type = "highpass"; f.frequency.value = 7000; dur = 0.035; gain = 0.10 * v; }
      const g = AC.createGain();
      g.gain.setValueAtTime(gain, when);
      g.gain.exponentialRampToValueAtTime(0.001, when + dur);
      src.connect(f); f.connect(g); g.connect(bgmGain);
      src.start(when); src.stop(when + dur + 0.02);
    }
  }
  function startBGM() {
    if (!settings.music || bgmOn) return;
    ensureAudio();
    bgmOn = true;
    bgmIdx = 0;
    bgmStart = AC.currentTime + 0.15;
    bgmTimer = setInterval(pumpBGM, 200);
    pumpBGM();
  }
  function pumpBGM() {
    if (!bgmOn) return;
    const horizon = AC.currentTime + 0.6;
    while (true) {
      if (bgmIdx >= BGM_NOTES.length) { bgmIdx = 0; bgmStart += BGM_LENGTH; }
      const nt = BGM_NOTES[bgmIdx];
      const when = bgmStart + nt[0];
      if (when > horizon) break;
      if (when >= AC.currentTime - 0.05) scheduleNote(nt, Math.max(when, AC.currentTime + 0.01));
      bgmIdx++;
    }
  }
  function stopBGM() {
    bgmOn = false;
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  }

  // --- SFX ---
  function sfx(kind) {
    if (!settings.sfx) return;
    ensureAudio();
    const t = AC.currentTime;
    if (kind === "jump") {
      const o = AC.createOscillator(); o.type = "square";
      o.frequency.setValueAtTime(320, t);
      o.frequency.exponentialRampToValueAtTime(720, t + 0.09);
      const g = AC.createGain();
      g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 0.12);
    } else if (kind === "land") {
      const src = AC.createBufferSource(); src.buffer = getNoise();
      const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 700;
      const g = AC.createGain();
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      src.connect(f); f.connect(g); g.connect(sfxGain); src.start(t); src.stop(t + 0.08);
    } else if (kind === "spring") {
      const o = AC.createOscillator(); o.type = "triangle";
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(980, t + 0.16);
      const g = AC.createGain();
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 0.22);
    } else if (kind === "over") {
      const o = AC.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(500, t);
      o.frequency.exponentialRampToValueAtTime(60, t + 0.7);
      const g = AC.createGain();
      g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
      o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 0.8);
    }
  }

  // ================= Input =================
  // inputHeld buffers a press made while airborne: charging then starts
  // automatically the moment the player lands.
  let inputHeld = false;
  function pressDown() {
    if (state !== "play") return;
    inputHeld = true;
    if (player.onGround && !charging) { charging = true; power = POWER_MIN; powerDir = 1; }
  }
  function pressUp() {
    inputHeld = false;
    if (state !== "play") return;
    if (charging) { charging = false; doJump(power); }
  }
  function doJump(p) {
    if (!player.onGround) return;
    player.vy = -p;
    player.onGround = false;
    player.standing = null;
    player.squash = -0.5;
    jumps++;
    sfx("jump");
    spawnBurst(player.x + CHAR_W / 2, player.y + CHAR_H, "#ffd35d", 7);
  }
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      if (state === "play") pressDown();
    } else if (e.code === "Escape") {
      if (state === "play") setPause(true);
      else if (state === "pause") setPause(false);
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") { e.preventDefault(); pressUp(); }
  });
  canvas.addEventListener("mousedown", (e) => { e.preventDefault(); pressDown(); });
  window.addEventListener("mouseup", () => { pressUp(); });
  // Only preventDefault for touches that start ON the canvas — a blanket
  // preventDefault on window's touchend suppresses click events, which
  // made the UI buttons dead on mobile.
  let touchHeld = false;
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); touchHeld = true; pressDown(); }, { passive: false });
  window.addEventListener("touchend", (e) => {
    if (touchHeld) { touchHeld = false; e.preventDefault(); pressUp(); }
  }, { passive: false });
  window.addEventListener("touchcancel", () => { if (touchHeld) { touchHeld = false; pressUp(); } });

  // ================= Particles =================
  function spawnBurst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      particles.push({ x, y, vx: rand(-2.2, 2.2), vy: rand(-3.2, 0.5), life: 1, color, size: rand(2, 4) });
    }
  }

  // ================= Update =================
  function update() {
    time++;
    if (state !== "play") return;

    if (charging) {
      power += CHARGE_RATE * powerDir;
      if (power >= POWER_MAX) { power = POWER_MAX; powerDir = -1; }
      if (power <= POWER_MIN) { power = POWER_MIN; powerDir = 1; }
    }

    // platform motion
    for (const p of platforms) {
      if (p.type === T_HMOVE) {
        p.x += p.spd * p.dir;
        if (p.x <= p.range[0]) { p.x = p.range[0]; p.dir = 1; }
        if (p.x >= p.range[1]) { p.x = p.range[1]; p.dir = -1; }
      } else if (p.type === T_VMOVE) {
        p.phase += 0.03;
        p.y = p.baseY + Math.sin(p.phase) * 22;
      }
    }

    // horizontal auto-walk
    let vx = player.vx;
    const st = player.standing;
    if (player.onGround && st) {
      if (st.type === T_CONVEYOR) vx += st.dir * 1.5;
      if (st.type === T_HMOVE) player.x += st.spd * st.dir;
      if (st.type === T_VMOVE) player.y = st.y - CHAR_H;
    }
    player.x += vx;
    player.face = player.vx < 0 ? -1 : 1;
    if (player.x <= INNER_L) { player.x = INNER_L; player.vx = Math.abs(player.vx); }
    if (player.x + CHAR_W >= INNER_R) { player.x = INNER_R - CHAR_W; player.vx = -Math.abs(player.vx); }

    // vertical
    if (!player.onGround) {
      player.vy += GRAV;
      const prevBottom = player.y + CHAR_H;
      player.y += player.vy;
      const newBottom = player.y + CHAR_H;
      if (player.vy > 0) {
        for (const p of platforms) {
          const top = p.y;
          const withinX = player.x + CHAR_W > p.x + 3 && player.x < p.x + p.w - 3;
          if (withinX && prevBottom <= top + 8 && newBottom >= top) {
            player.y = top - CHAR_H;
            player.vy = 0;
            player.onGround = true;
            player.standing = p;
            player.squash = 0.6;
            if (p.floor > score) score = p.floor;
            if (p.type === T_SPRING) {
              // launch immediately; a held charge is cancelled
              charging = false;
              player.vy = -SPRING_POWER;
              player.onGround = false;
              player.standing = null;
              player.squash = -0.6;
              sfx("spring");
              spawnBurst(player.x + CHAR_W / 2, player.y + CHAR_H, "#ff5da2", 10);
            } else {
              sfx("land");
              if (inputHeld && !charging) { charging = true; power = POWER_MIN; powerDir = 1; }
            }
            break;
          }
        }
      }
    } else {
      const p = player.standing;
      if (!p || player.x + CHAR_W < p.x + 2 || player.x > p.x + p.w - 2) {
        player.onGround = false;
        player.standing = null;
        player.vy = 0.5;
        charging = false;
      }
    }

    player.squash *= 0.82;

    // camera
    const desired = player.y - H * 0.45;
    if (desired < camTarget) camTarget = desired;
    camTop += (camTarget - camTop) * 0.12;

    ensurePlatforms();

    if (player.y > camTop + H + 20) gameOver();

    for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life -= 0.03; }
    particles = particles.filter(pt => pt.life > 0);
  }

  // ================= Render =================
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const climbNorm = Math.min(score / 400, 1);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${225 + climbNorm * 70}, 45%, ${6 + climbNorm * 7}%)`);
    g.addColorStop(1, "hsl(230, 40%, 4%)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const oy = -camTop;
    drawBackground(oy);
    for (const p of platforms) drawPlatform(p, oy);
    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y + oy - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
    if (player) drawPlayer(oy);
    drawWalls(oy);
    drawHUD();
  }

  function drawBackground(oy) {
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = "#c9a15d";
    ctx.lineWidth = 1;
    const sp = FLOOR_GAP;
    const off = ((oy % sp) + sp) % sp;
    for (let y = off - sp; y < H + sp; y += sp) {
      ctx.beginPath(); ctx.moveTo(INNER_L, y); ctx.lineTo(INNER_R, y); ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 40; i++) {
      const sx = (i * 97) % INNER_W + INNER_L;
      const sy = (((i * 131) - camTop * 0.3) % H + H) % H;
      ctx.globalAlpha = 0.10 + (i % 5) * 0.04;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.restore();
  }

  function drawWalls(oy) {
    // brick towers on both sides
    const BH = 22, BW = 34;
    ctx.fillStyle = "#3a2f28";
    ctx.fillRect(0, 0, WALL, H);
    ctx.fillRect(W - WALL, 0, WALL, H);
    ctx.strokeStyle = "rgba(0,0,0,0.4)";
    ctx.lineWidth = 1.5;
    const off = ((oy % (BH * 2)) + BH * 2) % (BH * 2);
    for (let y = off - BH * 2; y < H + BH; y += BH) {
      const rowIdx = Math.round((y - off) / BH);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WALL, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W - WALL, y); ctx.lineTo(W, y); ctx.stroke();
      const bx = (rowIdx % 2 === 0) ? WALL / 2 : WALL / 3;
      ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx, y + BH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W - WALL + bx, y); ctx.lineTo(W - WALL + bx, y + BH); ctx.stroke();
    }
    // brick highlight
    ctx.fillStyle = "rgba(255,220,170,0.07)";
    ctx.fillRect(0, 0, WALL, H);
    ctx.fillRect(W - WALL, 0, WALL, H);
    // inner edge
    ctx.fillStyle = "rgba(20,12,8,0.8)";
    ctx.fillRect(WALL - 3, 0, 3, H);
    ctx.fillRect(W - WALL, 0, 3, H);

    // floor number tags every 10 floors
    ctx.save();
    ctx.font = "bold 10px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "rgba(255,220,170,0.5)";
    ctx.textAlign = "center";
    for (let f = 10; ; f += 10) {
      const sy = START_Y - f * FLOOR_GAP + oy;
      if (sy < -20) break;
      if (sy > H + 20) continue;
      ctx.fillText(f, WALL / 2, sy + 3);
      ctx.fillText(f, W - WALL / 2, sy + 3);
    }
    ctx.restore();
  }

  function drawPlatform(p, oy) {
    const sy = p.y + oy;
    if (sy < -30 || sy > H + 30) return;
    let color = "#b08d4f", glow = "rgba(200,160,90,0.35)";
    if (p.type === T_CONVEYOR) { color = "#e0912f"; glow = "rgba(255,170,60,0.5)"; }
    else if (p.type === T_HMOVE) { color = "#4fa5b0"; glow = "rgba(90,200,215,0.5)"; }
    else if (p.type === T_VMOVE) { color = "#6fb05f"; glow = "rgba(130,210,110,0.5)"; }
    else if (p.type === T_SPRING) { color = "#c25064"; glow = "rgba(240,110,130,0.5)"; }

    ctx.save();
    ctx.shadowColor = glow;
    ctx.shadowBlur = 10;
    roundRect(p.x, sy, p.w, p.h, 4);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    ctx.fillRect(p.x + 3, sy + 2, p.w - 6, 2);

    if (p.type === T_CONVEYOR) {
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      const t = (time * 1.6) % 14;
      for (let cx = p.x + 5; cx < p.x + p.w - 8; cx += 14) {
        const dx = p.dir > 0 ? (cx + t) : (cx - t + 14);
        if (dx > p.x + 3 && dx < p.x + p.w - 8) {
          ctx.beginPath();
          if (p.dir > 0) { ctx.moveTo(dx, sy + 4); ctx.lineTo(dx + 5, sy + 6); ctx.lineTo(dx, sy + 8); }
          else { ctx.moveTo(dx + 5, sy + 4); ctx.lineTo(dx, sy + 6); ctx.lineTo(dx + 5, sy + 8); }
          ctx.fill();
        }
      }
    } else if (p.type === T_HMOVE) {
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.fillRect(p.x + p.w / 2 - 9, sy + 4, 18, 4);
    } else if (p.type === T_VMOVE) {
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      const mx = p.x + p.w / 2;
      ctx.beginPath();
      ctx.moveTo(mx - 4, sy + 6); ctx.lineTo(mx, sy + 2); ctx.lineTo(mx + 4, sy + 6);
      ctx.moveTo(mx - 4, sy + 7); ctx.lineTo(mx, sy + 11); ctx.lineTo(mx + 4, sy + 7);
      ctx.fill();
    } else if (p.type === T_SPRING) {
      // spring coils
      ctx.strokeStyle = "rgba(255,255,255,0.6)";
      ctx.lineWidth = 1.5;
      const n = Math.max(2, Math.floor(p.w / 24));
      for (let i = 0; i < n; i++) {
        const cx = p.x + (i + 0.5) * (p.w / n);
        ctx.beginPath();
        ctx.arc(cx, sy + 6, 3.5, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawPlayer(oy) {
    const sy = player.y + oy;
    const sq = player.squash;
    const w = CHAR_W * (1 + sq * 0.5);
    const h = CHAR_H * (1 - sq * 0.5);
    const cx = player.x + CHAR_W / 2;
    const bottom = sy + CHAR_H;
    const px = cx - w / 2;
    const py = bottom - h;

    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(cx, bottom + 3, w * 0.5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (charging) {
      const pn = (power - POWER_MIN) / (POWER_MAX - POWER_MIN);
      ctx.shadowColor = pn > 0.75 ? "#ff5da2" : "#ffd35d";
      ctx.shadowBlur = 6 + pn * 20;
    }

    // little climber guy: cap, face, overalls
    const capH = h * 0.22, faceH = h * 0.3, bodyH = h - capH - faceH;
    // body (blue overalls)
    ctx.fillStyle = "#3d6fd6";
    roundRect(px, py + capH + faceH, w, bodyH, 4); ctx.fill();
    // face
    ctx.fillStyle = "#f5c9a0";
    ctx.fillRect(px + w * 0.08, py + capH, w * 0.84, faceH);
    // cap (red)
    ctx.fillStyle = "#d64545";
    roundRect(px, py, w, capH + 2, 5); ctx.fill();
    // cap brim toward facing dir
    ctx.fillRect(player.face > 0 ? px + w * 0.55 : px - w * 0.15, py + capH - 2, w * 0.6, 3);
    // eyes
    ctx.fillStyle = "#222";
    const eo = player.face * 2.5;
    const eyeY = py + capH + faceH * 0.5;
    ctx.beginPath();
    ctx.arc(cx - 4 + eo, eyeY, 1.8, 0, Math.PI * 2);
    ctx.arc(cx + 4 + eo, eyeY, 1.8, 0, Math.PI * 2);
    ctx.fill();
    // feet
    ctx.fillStyle = "#7a4a24";
    ctx.fillRect(px + 2, bottom - 3, w * 0.32, 3);
    ctx.fillRect(px + w - 2 - w * 0.32, bottom - 3, w * 0.32, 3);
    ctx.restore();

    if (charging) drawPowerGauge(cx, py - 14);
  }

  function drawPowerGauge(cx, y) {
    const gw = 44, gh = 7;
    const pn = (power - POWER_MIN) / (POWER_MAX - POWER_MIN);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(cx - gw / 2 - 2, y - 2, gw + 4, gh + 4, 4); ctx.fill();
    let col = "#7ddf6e";
    if (powerDir < 0) col = "#ff5da2";
    else if (pn > 0.7) col = "#ffd35d";
    ctx.fillStyle = col;
    roundRect(cx - gw / 2, y, gw * pn, gh, 3); ctx.fill();
  }

  function drawHUD() {
    ctx.save();
    ctx.font = "bold 15px 'Trebuchet MS', sans-serif";
    ctx.textBaseline = "middle";
    // floor
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    roundRect(8, 8, 108, 30, 8); ctx.fill();
    ctx.fillStyle = "#ffd35d";
    ctx.fillText("🏰 " + score + "층", 18, 24);
    // best of current difficulty (or practice tag)
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    roundRect(W - 124, 8, 116, 30, 8); ctx.fill();
    ctx.textAlign = "right";
    if (practice) {
      ctx.fillStyle = "#8fd8ff";
      ctx.fillText("연습 모드", W - 18, 24);
    } else {
      const recs = loadRecords(settings.diff);
      const b = recs.length ? recs[0].floor : 0;
      ctx.fillStyle = "#ff8fc0";
      ctx.fillText("최고 " + b + "층", W - 18, 24);
    }
    // jump counter option
    if (settings.jumps && state !== "menu") {
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      roundRect(8, 42, 108, 26, 8); ctx.fill();
      ctx.fillStyle = "#bfe0ff";
      ctx.font = "bold 13px 'Trebuchet MS', sans-serif";
      ctx.fillText("점프 " + jumps + "회", 18, 55);
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    if (w <= 0) { ctx.beginPath(); ctx.rect(x, y, 0.001, h); ctx.closePath(); return; }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ================= Flow =================
  const $ = (id) => document.getElementById(id);
  const startScreen = $("startScreen"), overScreen = $("overScreen"), pauseScreen = $("pauseScreen");
  const pauseBtn = $("pauseBtn");

  function show(el) { el.classList.remove("hidden"); }
  function hide(el) { el.classList.add("hidden"); }

  function startGame(isPractice) {
    practice = isPractice;
    hide(startScreen); hide(overScreen); hide(pauseScreen);
    pauseBtn.style.display = "block";
    reset();
    state = "play";
    ensureAudio();
    startBGM();
  }

  function setPause(on) {
    if (on && state === "play") {
      state = "pause";
      show(pauseScreen);
      if (AC) AC.suspend();
    } else if (!on && state === "pause") {
      state = "play";
      hide(pauseScreen);
      if (AC) AC.resume();
    }
  }

  function toMenu() {
    state = "menu";
    stopBGM();
    hide(overScreen); hide(pauseScreen);
    show(startScreen);
    pauseBtn.style.display = "none";
    if (AC && AC.state === "suspended") AC.resume();
    reset(); // idle background
  }

  let pendingRecord = null;
  function gameOver() {
    state = "over";
    stopBGM();
    sfx("over");
    pauseBtn.style.display = "none";
    $("finalScore").textContent = score;
    $("overInfo").textContent =
      (practice ? "연습 모드 · " : "") +
      ({ easy: "쉬움", normal: "보통", hard: "어려움" }[settings.diff]) +
      " · 점프 " + jumps + "회";

    const recs = loadRecords(settings.diff);
    const wouldRank = sortRecords(recs.concat([{ name: "?", floor: score, jumps }]))
      .some(r => r.name === "?" && r.floor === score && r.jumps === jumps);
    const nameRow = $("nameRow");
    if (!practice && score > 0 && wouldRank) {
      pendingRecord = { floor: score, jumps };
      nameRow.style.display = "flex";
      $("nameInput").value = localStorage.getItem("nstower_name") || "";
    } else {
      pendingRecord = null;
      nameRow.style.display = "none";
    }
    renderScores(null);
    show(overScreen);
  }

  function renderScores(highlightIdx) {
    const list = $("scoreList");
    const recs = sortRecords(loadRecords(settings.diff));
    list.innerHTML = "";
    if (recs.length === 0) {
      const li = document.createElement("li");
      li.innerHTML = `<span class="rk">-</span><span class="nm">아직 기록이 없어요</span><span></span>`;
      list.appendChild(li);
      return;
    }
    recs.forEach((r, i) => {
      const li = document.createElement("li");
      if (i === highlightIdx) li.className = "me";
      li.innerHTML = `<span class="rk">${i + 1}위</span><span class="nm">${escapeHtml(r.name)}</span><span>${r.floor}층 · ${r.jumps}점프</span>`;
      list.appendChild(li);
    });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  $("regBtn").addEventListener("click", () => {
    if (!pendingRecord) return;
    const name = ($("nameInput").value.trim() || "무명").slice(0, 10);
    try { localStorage.setItem("nstower_name", name); } catch (e) {}
    const recs = loadRecords(settings.diff);
    recs.push({ name, floor: pendingRecord.floor, jumps: pendingRecord.jumps });
    const sorted = sortRecords(recs);
    saveJSON(recKey(settings.diff), sorted);
    const idx = sorted.findIndex(r => r.name === name && r.floor === pendingRecord.floor && r.jumps === pendingRecord.jumps);
    pendingRecord = null;
    $("nameRow").style.display = "none";
    renderScores(idx);
  });

  // ================= Menu wiring =================
  function wireToggleRow(rowId, dataAttr, apply) {
    $(rowId).addEventListener("click", (e) => {
      const el = e.target.closest(".opt");
      if (!el) return;
      apply(el);
      saveSettings();
    });
  }
  // difficulty: radio behavior
  wireToggleRow("diffRow", "diff", (el) => {
    document.querySelectorAll("#diffRow .opt").forEach(o => o.classList.remove("on"));
    el.classList.add("on");
    settings.diff = el.dataset.diff;
  });
  // special floors: checkboxes
  wireToggleRow("floorRow", "floor", (el) => {
    el.classList.toggle("on");
    settings.floors[el.dataset.floor] = el.classList.contains("on");
  });
  // options: checkboxes
  wireToggleRow("optRow", "opt", (el) => {
    el.classList.toggle("on");
    settings[el.dataset.opt] = el.classList.contains("on");
    if (el.dataset.opt === "music" && !settings.music) stopBGM();
  });

  function syncMenuUI() {
    document.querySelectorAll("#diffRow .opt").forEach(o =>
      o.classList.toggle("on", o.dataset.diff === settings.diff));
    document.querySelectorAll("#floorRow .opt").forEach(o =>
      o.classList.toggle("on", !!settings.floors[o.dataset.floor]));
    document.querySelectorAll("#optRow .opt").forEach(o =>
      o.classList.toggle("on", !!settings[o.dataset.opt]));
  }
  syncMenuUI();

  $("startBtn").addEventListener("click", () => startGame(false));
  $("practiceBtn").addEventListener("click", () => startGame(true));
  $("retryBtn").addEventListener("click", () => startGame(practice));
  $("menuBtn").addEventListener("click", toMenu);
  $("resumeBtn").addEventListener("click", () => setPause(false));
  $("quitBtn").addEventListener("click", toMenu);
  pauseBtn.addEventListener("click", () => setPause(state === "play"));
  $("clearBtn").addEventListener("click", () => {
    if (confirm("모든 난이도의 베스트 5 기록을 지울까요?")) {
      ["easy", "normal", "hard"].forEach(d => { try { localStorage.removeItem(recKey(d)); } catch (e) {} });
    }
  });

  // ================= Main loop =================
  let acc = 0, last = performance.now();
  const STEP = 1000 / 60;
  function loop(now) {
    let dt = now - last; last = now;
    if (dt > 100) dt = 100;
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 5) { update(); acc -= STEP; steps++; }
    draw();
    requestAnimationFrame(loop);
  }

  reset(); // idle tower behind the menu
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
