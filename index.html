<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NS-Tower — 탑 오르기</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: rgba(12, 18, 36, 0.85);
    --accent: #35e0d0;
    --accent2: #ff5da2;
    --text: #e8f0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #05070f;
    box-shadow: 0 0 60px rgba(53, 224, 208, 0.15), 0 0 0 1px rgba(255,255,255,0.05);
    border-radius: 10px;
    image-rendering: -webkit-optimize-contrast;
  }
  /* Overlays */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    background: rgba(5, 7, 15, 0.72);
    backdrop-filter: blur(3px);
    pointer-events: auto;
  }
  .overlay.hidden { display: none; }
  h1 {
    font-size: clamp(28px, 8vw, 46px);
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(53,224,208,0.3);
    margin-bottom: 6px;
  }
  .sub { color: #9fb3d0; font-size: 14px; margin-bottom: 22px; letter-spacing: 1px; }
  .card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 18px 22px;
    max-width: 340px;
    line-height: 1.7;
    font-size: 14px;
    color: #cfe0f5;
    margin-bottom: 22px;
  }
  .card b { color: var(--accent); }
  .key {
    display: inline-block;
    background: #1b2440;
    border: 1px solid rgba(255,255,255,0.15);
    border-bottom-width: 3px;
    border-radius: 6px;
    padding: 1px 8px;
    font-weight: bold;
    color: #fff;
    font-size: 12px;
  }
  button {
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #051018;
    background: linear-gradient(180deg, #55f0df, var(--accent));
    border: none;
    border-radius: 40px;
    padding: 13px 40px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(53,224,208,0.35);
    transition: transform 0.08s ease, box-shadow 0.2s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(53,224,208,0.5); }
  button:active { transform: translateY(1px); }
  .big-score { font-size: 52px; font-weight: bold; color: var(--accent); text-shadow: 0 0 24px rgba(53,224,208,0.4); }
  .best { color: var(--accent2); font-size: 15px; margin: 6px 0 20px; }
  .scores { list-style: none; font-size: 13px; color: #a9bcd8; margin-bottom: 20px; }
  .scores li { display:flex; justify-content:space-between; gap:24px; padding:2px 0; }
  .scores li span:first-child { color:#6f83a3; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- Start -->
  <div id="startScreen" class="overlay">
    <h1>NS-TOWER</h1>
    <div class="sub">끝없는 탑을 올라라</div>
    <div class="card">
      🧗 캐릭터는 <b>좌우로 자동</b>으로 움직여요. 벽에 부딪히면 방향이 바뀌죠.<br>
      ⚡ <span class="key">SPACE</span> 또는 <span class="key">마우스 / 터치</span>를 <b>누르고 있으면 파워 충전</b>, 떼면 점프!<br>
      🎯 오래 누를수록 높이 뛰지만, <b>너무 오래 누르면 파워가 0으로</b> 떨어져요.<br>
      💀 발판을 놓쳐 화면 <b>아래로 떨어지면</b> 끝!
    </div>
    <button id="startBtn">시작하기</button>
  </div>

  <!-- Game Over -->
  <div id="overScreen" class="overlay hidden">
    <h1 style="font-size:34px">GAME OVER</h1>
    <div class="big-score"><span id="finalScore">0</span> m</div>
    <div class="best" id="bestLine">최고 기록: 0 m</div>
    <ul class="scores" id="scoreList"></ul>
    <button id="retryBtn">다시 도전</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---- Logical resolution (portrait tower) ----
  const W = 420, H = 720;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // Fit canvas to screen while keeping aspect ratio, with crisp rendering.
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    const pad = 16;
    const availW = window.innerWidth - pad;
    const availH = window.innerHeight - pad;
    const scale = Math.min(availW / W, availH / H);
    canvas.style.width = Math.round(W * scale) + "px";
    canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- Tower geometry ----
  const WALL = 34;                 // wall thickness on each side
  const INNER_L = WALL;            // playable left edge (inner wall face)
  const INNER_R = W - WALL;        // playable right edge
  const INNER_W = INNER_R - INNER_L;

  // ---- Physics constants ----
  const GRAV = 0.42;
  const MOVE_SPEED = 2.25;         // constant horizontal speed
  const POWER_MIN = 5.2;
  const POWER_MAX = 15.5;
  const CHARGE_RATE = 0.30;        // power units per frame while charging
  const CHAR_W = 26, CHAR_H = 28;

  // ---- Game state ----
  let platforms = [];
  let player, camTop, camTarget, highestY, score, best, running, charging, power, powerDir, over;
  let nextPlatId = 0;
  let scores = loadScores();
  let particles = [];
  let time = 0;

  function loadScores() {
    try {
      const s = JSON.parse(localStorage.getItem("nstower_scores") || "[]");
      if (Array.isArray(s)) return s.filter(n => typeof n === "number").sort((a,b)=>b-a).slice(0,5);
    } catch (e) {}
    return [];
  }
  function saveScore(v) {
    scores.push(v);
    scores.sort((a,b)=>b-a);
    scores = scores.slice(0,5);
    try { localStorage.setItem("nstower_scores", JSON.stringify(scores)); } catch(e) {}
  }

  // Platform types
  const T_NORMAL = 0, T_CONVEYOR = 1, T_MOVING = 2, T_CRUMBLE = 3;

  let lastCenter = null; // horizontal center of the previously placed platform

  function makePlatform(y, opts) {
    opts = opts || {};
    const forceWide = !!opts.wide;
    const isCenter = !!opts.center;   // center platform (conveyor-heavy)
    const w = forceWide ? INNER_W - 20 : (isCenter ? rand(72, 108) : rand(64, 120));
    const mid = (INNER_L + INNER_R) / 2;
    let x;
    if (forceWide) {
      x = INNER_L + 10;
      lastCenter = x + w / 2;
    } else if (isCenter) {
      // Sit near the middle with a little jitter. Does NOT disturb the
      // left/right alternation of the surrounding side platforms.
      const jitter = INNER_W * 0.14;
      let c = mid + rand(-jitter, jitter);
      c = Math.max(INNER_L + w / 2 + 4, Math.min(INNER_R - w / 2 - 4, c));
      x = c - w / 2;
    } else {
      // Alternate each new platform toward the OPPOSITE wall from the last one,
      // so the left-right spread is wide instead of clustered near center.
      const cMin = INNER_L + w / 2 + 4;        // min possible center
      const cMax = INNER_R - w / 2 - 4;        // max possible center
      const SPREAD = 0.78;                      // 0=center, 1=hard against walls
      let center;
      if (lastCenter === null) {
        center = rand(cMin, cMax);
      } else if (lastCenter >= mid) {
        // go left, into the outer portion of the left half
        center = rand(cMin, cMin + (mid - cMin) * (1 - SPREAD));
      } else {
        // go right, into the outer portion of the right half
        center = rand(cMax - (cMax - mid) * (1 - SPREAD), cMax);
      }
      lastCenter = center;
      x = center - w / 2;
    }
    // pick type by height difficulty
    const h = -y; // world height climbed roughly
    let type = T_NORMAL;
    if (isCenter) {
      // Center platforms are mostly conveyor belts.
      const r = Math.random();
      if (r < 0.75) type = T_CONVEYOR;
      else if (r < 0.88) type = T_MOVING;
    } else if (!forceWide) {
      const r = Math.random();
      const diff = Math.min(h / 4000, 0.6); // ramps up
      if (r < 0.12 + diff * 0.20) type = T_CONVEYOR;
      else if (r < 0.20 + diff * 0.30) type = T_MOVING;
      else if (r < 0.24 + diff * 0.22) type = T_CRUMBLE;
    }
    const p = {
      id: nextPlatId++,
      x, y, w, h: 12, type,
      dir: Math.random() < 0.5 ? -1 : 1,     // conveyor / moving direction
      mvSpeed: rand(0.7, 1.4),
      mvRange: [INNER_L + 4, INNER_R - w - 4],
      crumbleT: 0,       // >0 = crumbling countdown
      gone: false,
    };
    return p;
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function seedTower() {
    platforms = [];
    nextPlatId = 0;
    // ground / start platform
    const start = makePlatform(H - 120, { wide: true });
    start.type = T_NORMAL;
    platforms.push(start);
    let y = start.y;
    for (let i = 0; i < 64; i++) {
      y -= rand(44, 72);
      platforms.push(makePlatform(y, {}));
      // Frequently drop in an extra center conveyor platform between rows.
      if (Math.random() < 0.6) {
        y -= rand(30, 46);
        platforms.push(makePlatform(y, { center: true }));
      }
    }
    return start;
  }

  function ensurePlatforms() {
    // Always keep platforms generated well above the camera
    let topY = Math.min(...platforms.map(p => p.y));
    while (topY > camTop - H) {
      topY -= rand(44, 72);
      platforms.push(makePlatform(topY, {}));
      if (Math.random() < 0.6) {
        topY -= rand(30, 46);
        platforms.push(makePlatform(topY, { center: true }));
      }
    }
    // Cull far below
    const cullBelow = camTop + H + 200;
    platforms = platforms.filter(p => p.y < cullBelow);
  }

  function reset() {
    const start = seedTower();
    player = {
      x: (INNER_L + INNER_R) / 2 - CHAR_W / 2,
      y: start.y - CHAR_H,
      vx: MOVE_SPEED * (Math.random() < 0.5 ? -1 : 1),
      vy: 0,
      onGround: true,
      standing: start,
      squash: 0,
      face: 1,
    };
    camTop = player.y - H * 0.42;
    camTarget = camTop;
    highestY = player.y;
    score = 0;
    charging = false;
    power = POWER_MIN;
    powerDir = 1;
    over = false;
    running = true;
    particles = [];
  }

  // ---- Input ----
  function pressDown() {
    if (!running || over) return;
    if (player.onGround && !charging) {
      charging = true;
      power = POWER_MIN;
      powerDir = 1;
    }
  }
  function pressUp() {
    if (!running || over) return;
    if (charging) {
      charging = false;
      doJump(power);
    }
  }
  function doJump(p) {
    if (!player.onGround) return;
    player.vy = -p;
    player.onGround = false;
    player.squash = -0.5; // stretch
    const st = player.standing;
    // crumble platforms break when you jump off
    if (st && st.type === T_CRUMBLE) st.crumbleT = 1;
    player.standing = null;
    spawnBurst(player.x + CHAR_W/2, player.y + CHAR_H, "#35e0d0", 8);
  }

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); pressDown(); }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") { e.preventDefault(); pressUp(); }
  });
  canvas.addEventListener("mousedown", (e) => { e.preventDefault(); pressDown(); });
  window.addEventListener("mouseup", (e) => { pressUp(); });
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); pressDown(); }, {passive:false});
  window.addEventListener("touchend", (e) => { e.preventDefault(); pressUp(); }, {passive:false});

  // ---- Particles ----
  function spawnBurst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: rand(-2.2, 2.2), vy: rand(-3.2, 0.5),
        life: 1, color, size: rand(2, 4),
      });
    }
  }

  // ---- Update ----
  function update() {
    time++;
    if (!running || over) return;

    // Charging: ping-pong power up then down to zero-ish then up again
    if (charging) {
      power += CHARGE_RATE * powerDir;
      if (power >= POWER_MAX) { power = POWER_MAX; powerDir = -1; }
      if (power <= POWER_MIN * 0.35) { power = POWER_MIN * 0.35; powerDir = 1; }
    }

    // Move platforms (moving type) & crumble timers
    for (const p of platforms) {
      if (p.type === T_MOVING) {
        p.x += p.mvSpeed * p.dir;
        if (p.x <= p.mvRange[0]) { p.x = p.mvRange[0]; p.dir = 1; }
        if (p.x >= p.mvRange[1]) { p.x = p.mvRange[1]; p.dir = -1; }
      }
      if (p.crumbleT > 0) {
        p.crumbleT += 0.04;
        if (p.crumbleT > 1.6) p.gone = true;
      }
    }
    platforms = platforms.filter(p => !p.gone);

    // Horizontal movement (always moving)
    let vx = player.vx;
    // conveyor influence while standing
    if (player.onGround && player.standing && player.standing.type === T_CONVEYOR) {
      vx += player.standing.dir * 1.5;
    }
    // moving platform carries player
    if (player.onGround && player.standing && player.standing.type === T_MOVING) {
      player.x += player.standing.mvSpeed * player.standing.dir;
    }
    player.x += vx;
    player.face = player.vx < 0 ? -1 : 1;

    // Wall bounce (reverse direction even mid-air)
    if (player.x <= INNER_L) { player.x = INNER_L; player.vx = Math.abs(player.vx); }
    if (player.x + CHAR_W >= INNER_R) { player.x = INNER_R - CHAR_W; player.vx = -Math.abs(player.vx); }

    // Vertical / gravity
    if (!player.onGround) {
      player.vy += GRAV;
      const prevBottom = player.y + CHAR_H;
      player.y += player.vy;
      const newBottom = player.y + CHAR_H;

      // Land on a platform (one-way, only when falling)
      if (player.vy > 0) {
        for (const p of platforms) {
          if (p.crumbleT > 0.8) continue; // too crumbled
          const top = p.y;
          const withinX = player.x + CHAR_W > p.x + 3 && player.x < p.x + p.w - 3;
          if (withinX && prevBottom <= top + 6 && newBottom >= top) {
            player.y = top - CHAR_H;
            player.vy = 0;
            player.onGround = true;
            player.standing = p;
            player.squash = 0.6; // squash on land
            spawnBurst(player.x + CHAR_W/2, player.y + CHAR_H, "#ffd35d", 6);
            break;
          }
        }
      }
    } else {
      // check we're still on our platform
      const p = player.standing;
      if (!p || player.x + CHAR_W < p.x + 2 || player.x > p.x + p.w - 2) {
        player.onGround = false;
        player.standing = null;
        player.vy = 0.5;
        if (charging) { charging = false; } // fell off while charging
      }
    }

    // squash easing
    player.squash *= 0.82;

    // Track height & score
    if (player.y < highestY) highestY = player.y;
    const climbed = Math.max(0, Math.floor(((H - 120) - highestY) / 12));
    score = climbed;

    // Camera follows upward only
    const desired = player.y - H * 0.45;
    if (desired < camTarget) camTarget = desired;
    camTop += (camTarget - camTop) * 0.12;

    ensurePlatforms();

    // Death: fell below bottom of screen
    if (player.y > camTop + H + 20) {
      gameOver();
    }

    // particles
    for (const pt of particles) {
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life -= 0.03;
    }
    particles = particles.filter(pt => pt.life > 0);
  }

  function gameOver() {
    over = true;
    running = false;
    saveScore(score);
    best = scores[0] || 0;
    document.getElementById("finalScore").textContent = score;
    document.getElementById("bestLine").textContent = "최고 기록: " + best + " m";
    const list = document.getElementById("scoreList");
    list.innerHTML = "";
    scores.forEach((s, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<span>${i+1}위</span><span>${s} m</span>`;
      list.appendChild(li);
    });
    document.getElementById("overScreen").classList.remove("hidden");
  }

  // ---- Render ----
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background gradient shifts with height
    const climbNorm = Math.min(score / 800, 1);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    const hueTop = 220 + climbNorm * 80;
    g.addColorStop(0, `hsl(${hueTop}, 45%, ${6 + climbNorm*6}%)`);
    g.addColorStop(1, `hsl(${230}, 40%, 4%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Parallax stars / girders in the background
    drawBackground();

    // World transform: y_screen = y_world - camTop
    const oy = -camTop;

    // Draw platforms
    for (const p of platforms) {
      drawPlatform(p, oy);
    }

    // Particles
    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size/2, pt.y + oy - pt.size/2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;

    // Player
    drawPlayer(oy);

    // Walls (drawn on top to frame the tower)
    drawWalls();

    // HUD
    drawHUD();
  }

  function drawBackground() {
    // Faint vertical girders inside tower, scrolling with camera
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = "#7fb0ff";
    ctx.lineWidth = 2;
    const spacing = 90;
    const offset = ((-camTop) % spacing + spacing) % spacing;
    for (let y = offset - spacing; y < H + spacing; y += spacing) {
      ctx.beginPath();
      ctx.moveTo(INNER_L, y);
      ctx.lineTo(INNER_R, y);
      ctx.stroke();
    }
    ctx.restore();

    // stars
    ctx.save();
    ctx.fillStyle = "#ffffff";
    for (let i = 0; i < 40; i++) {
      const sx = (i * 97) % INNER_W + INNER_L;
      const sy = (((i * 131) - camTop * 0.3) % H + H) % H;
      ctx.globalAlpha = 0.15 + (i % 5) * 0.05;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.restore();
  }

  function drawWalls() {
    // left & right walls
    ctx.fillStyle = "#141c33";
    ctx.fillRect(0, 0, WALL, H);
    ctx.fillRect(W - WALL, 0, WALL, H);
    // inner edge glow
    ctx.fillStyle = "rgba(53,224,208,0.5)";
    ctx.fillRect(WALL - 3, 0, 3, H);
    ctx.fillRect(W - WALL, 0, 3, H);
    // rivet lines scrolling
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    const spacing = 40;
    const offset = ((-camTop) % spacing + spacing) % spacing;
    for (let y = offset; y < H; y += spacing) {
      ctx.fillRect(8, y, WALL - 16, 3);
      ctx.fillRect(W - WALL + 8, y, WALL - 16, 3);
    }
  }

  function drawPlatform(p, oy) {
    const sy = p.y + oy;
    if (sy < -30 || sy > H + 30) return;
    let color = "#4a6fa5", glow = "rgba(90,140,210,0.4)";
    if (p.type === T_CONVEYOR) { color = "#e0912f"; glow = "rgba(255,170,60,0.5)"; }
    else if (p.type === T_MOVING) { color = "#8b5de0"; glow = "rgba(160,110,240,0.5)"; }
    else if (p.type === T_CRUMBLE) { color = "#a64b4b"; glow = "rgba(220,90,90,0.5)"; }

    let alpha = 1, shake = 0;
    if (p.crumbleT > 0) {
      alpha = Math.max(0, 1 - p.crumbleT / 1.6);
      shake = Math.sin(p.crumbleT * 30) * 2;
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    // glow
    ctx.shadowColor = glow;
    ctx.shadowBlur = 12;
    // body
    roundRect(p.x + shake, sy, p.w, p.h, 5);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.shadowBlur = 0;
    // top highlight
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.fillRect(p.x + 4 + shake, sy + 2, p.w - 8, 2);

    // type decorations
    if (p.type === T_CONVEYOR) {
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      const t = (time * 1.6) % 16;
      for (let cx = p.x + 6; cx < p.x + p.w - 6; cx += 16) {
        const dx = p.dir > 0 ? (cx + t) : (cx - t + 16);
        if (dx > p.x + 3 && dx < p.x + p.w - 8) {
          // arrow
          ctx.beginPath();
          if (p.dir > 0) {
            ctx.moveTo(dx, sy + 4); ctx.lineTo(dx + 5, sy + 6); ctx.lineTo(dx, sy + 8);
          } else {
            ctx.moveTo(dx + 5, sy + 4); ctx.lineTo(dx, sy + 6); ctx.lineTo(dx + 5, sy + 8);
          }
          ctx.fill();
        }
      }
    } else if (p.type === T_MOVING) {
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.fillRect(p.x + p.w/2 - 8, sy + 4, 16, 4);
    }
    ctx.restore();
  }

  function drawPlayer(oy) {
    const sy = player.y + oy;
    // squash & stretch
    const sq = player.squash;
    const w = CHAR_W * (1 + sq * 0.5);
    const h = CHAR_H * (1 - sq * 0.5);
    const cx = player.x + CHAR_W / 2;
    const bottom = sy + CHAR_H;
    const px = cx - w / 2;
    const py = bottom - h;

    ctx.save();
    // shadow
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(cx, bottom + 3, w * 0.5, 4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // charging aura
    if (charging) {
      const pn = (power - POWER_MIN*0.35) / (POWER_MAX - POWER_MIN*0.35);
      ctx.shadowColor = pn > 0.75 ? "#ff5da2" : "#35e0d0";
      ctx.shadowBlur = 6 + pn * 22;
    }

    // body
    const grad = ctx.createLinearGradient(px, py, px, py + h);
    grad.addColorStop(0, "#7ff0e6");
    grad.addColorStop(1, "#35c8bd");
    ctx.fillStyle = grad;
    roundRect(px, py, w, h, 6);
    ctx.fill();
    ctx.shadowBlur = 0;

    // eyes (look toward movement direction)
    ctx.fillStyle = "#0a2a2a";
    const eo = player.face * 3;
    const eyeY = py + h * 0.38;
    ctx.beginPath();
    ctx.arc(cx - 5 + eo, eyeY, 2.6, 0, Math.PI*2);
    ctx.arc(cx + 5 + eo, eyeY, 2.6, 0, Math.PI*2);
    ctx.fill();
    // eye shine
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(cx - 5 + eo + 0.8, eyeY - 0.8, 0.9, 0, Math.PI*2);
    ctx.arc(cx + 5 + eo + 0.8, eyeY - 0.8, 0.9, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // charge power gauge above the player
    if (charging) {
      drawPowerGauge(cx, py - 14);
    }
  }

  function drawPowerGauge(cx, y) {
    const gw = 44, gh = 7;
    const pn = (power - POWER_MIN*0.35) / (POWER_MAX - POWER_MIN*0.35);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(cx - gw/2 - 2, y - 2, gw + 4, gh + 4, 4); ctx.fill();
    // fill color: green -> yellow -> red as it approaches danger of dropping
    let col = "#35e0d0";
    if (pn > 0.85) col = "#ff5da2";
    else if (pn > 0.6) col = "#ffd35d";
    ctx.fillStyle = col;
    roundRect(cx - gw/2, y, gw * pn, gh, 3); ctx.fill();
    // sweet-spot markers
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.fillRect(cx - gw/2 + gw*0.85, y, 1.5, gh);
  }

  function drawHUD() {
    ctx.save();
    ctx.font = "bold 15px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    roundRect(10, 10, 118, 30, 8); ctx.fill();
    ctx.fillStyle = "#35e0d0";
    ctx.textBaseline = "middle";
    ctx.fillText("▲ " + score + " m", 20, 26);

    const b = scores[0] || 0;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    roundRect(W - 128, 10, 118, 30, 8); ctx.fill();
    ctx.fillStyle = "#ff8fc0";
    ctx.textAlign = "right";
    ctx.fillText("최고 " + b + " m", W - 20, 26);
    ctx.restore();
  }

  // rounded rect path helper
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- Main loop (fixed timestep) ----
  let acc = 0, last = performance.now();
  const STEP = 1000 / 60;
  function loop(now) {
    let dt = now - last; last = now;
    if (dt > 100) dt = 100;
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 5) { update(); acc -= STEP; steps++; }
    draw();
    requestAnimationFrame(loop);
  }

  // ---- UI wiring ----
  const startScreen = document.getElementById("startScreen");
  const overScreen = document.getElementById("overScreen");
  function startGame() {
    startScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    reset();
  }
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

  // Idle background before start
  reset();
  running = false;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
